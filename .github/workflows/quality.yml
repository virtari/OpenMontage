name: Development quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PYCODE'
          import json, os, re, subprocess
          for key in ['BASE_SHA', 'HEAD_SHA']:
              assert re.fullmatch('[0-9a-f]{40}', os.environ[key]), 'Invalid commit identity'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['HEAD_SHA']
          paths = subprocess.check_output(['git','diff','--name-only','--no-renames','-z',os.environ['BASE_SHA']+'...'+os.environ['HEAD_SHA']])
          plan = subprocess.check_output(['python','-B','scripts/quality_gate.py','classify'],input=paths).decode().strip()
          print(plan)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('plan='+plan+'\n')
          PYCODE

  gate-tests:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -B -m unittest tests.test_quality_gate -v

  cli:
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).jobs, 'cli')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -B -m unittest tests.test_render_demo -v

  ui:
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).jobs, 'ui')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/ui
      - run: node --test docs/pilot/sau-4/prototype.test.cjs
        env:
          949feb2413d6458794dcd2491c4babbbce0c15c1_PATH: ${{ github.workspace }}/tests/ui/node_modules

  runtime:
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).jobs, 'runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m pytest tests/ --ignore=tests/qa --ignore=tests/eval -q

  composer:
    needs: classify
    if: needs.classify.result == 'success' && contains(fromJSON(needs.classify.outputs.plan).jobs, 'composer')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix remotion-composer
      - run: cd remotion-composer && ./node_modules/.bin/tsc --noEmit

  quality-gate:
    if: always()
    needs: [classify, gate-tests, cli, ui, runtime, composer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYCODE'
          import json, os, sys
          sys.path.insert(0,'scripts')
          import quality_gate
          needs = json.loads(os.environ['NEEDS'])
          if needs['classify']['result'] != 'success':
              raise SystemExit('CLASSIFICATION_NOT_SUCCESSFUL')
          selected = json.loads(needs['classify']['outputs']['plan'])['jobs']
          quality_gate.aggregate(selected, {j: needs[j] for j in quality_gate.JOBS})
          print('QUALITY_GATE_PASS')
          PYCODE
